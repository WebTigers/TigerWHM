name: CI
on:
  push: { branches: [main], tags: ['v*'] }
  pull_request:
permissions: { contents: write }
jobs:
  test:
    name: Lint + unit on PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy: { fail-fast: false, matrix: { php: ['8.1', '8.4'] } }
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: { php-version: '${{ matrix.php }}', coverage: none }
      - name: Syntax check (lib, pages, scripts)
        run: |
          for f in $(find lib cpanel whm -name '*.php' -o -name '*.cgi'); do php -l "$f" >/dev/null || exit 1; done
          bash -n install.sh && bash -n uninstall.sh && bash -n build.sh
      - name: Vendor the engine (the tagged release, never a working copy)
        run: ./build.sh
      - run: composer install --no-interaction --no-progress
      - run: vendor/bin/phpunit
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assert VERSION == tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"; VER="$(cat VERSION)"; [ "$TAG" = "$VER" ] || { echo "::error::VERSION ($VER) != tag ($TAG)"; exit 1; }
      - run: ./build.sh
      - name: Create the release (if the tag has none yet) and attach the tarball + checksum
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "TigerWHM ${GITHUB_REF_NAME#v}" --notes "See CHANGELOG.md."
          gh release upload "$GITHUB_REF_NAME" dist/tigerwhm-*.tar.gz dist/tigerwhm-*.tar.gz.sha256 --clobber
